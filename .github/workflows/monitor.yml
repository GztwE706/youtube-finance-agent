name: 📡 YouTube 財經特工

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Decode YouTube cookies
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES_B64 }}" | base64 -d > youtube_cookies.txt

      - name: Run agent
        env:
          LINE_TOKEN:     ${{ secrets.LINE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CHANNEL_URL:    ${{ secrets.CHANNEL_URL }}
        run: python agent.py

      - name: Commit history update
        run: |
          git config user.name  "youtube-agent[bot]"
          git config user.email "youtube-agent[bot]@users.noreply.github.com"
          git add history.txt
          git diff --staged --quiet || git commit -m "chore: update history [skip ci]"
          git push
